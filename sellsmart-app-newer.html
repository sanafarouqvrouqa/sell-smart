<script>
(function () {
  "use strict";
  if (window.__sellSmartInsightsInstalled) return;
  window.__sellSmartInsightsInstalled = true;

  var style = document.createElement("style");
  style.textContent = `
    #ss-insights-launch{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9998;border:0;border-radius:999px;background:#ffeb3b;color:#111;padding:12px 16px;font:800 13px system-ui,-apple-system,sans-serif;box-shadow:0 5px 20px #0002;cursor:pointer}
    #ss-insights-backdrop{position:fixed;inset:0;z-index:9999;background:#1119;display:none;align-items:center;justify-content:center;padding:14px;font-family:system-ui,-apple-system,sans-serif;color:#111}
    #ss-insights-panel{width:min(720px,100%);max-height:88vh;overflow:auto;background:#f7f7f4;border-radius:24px;padding:18px;box-shadow:0 20px 70px #0004}
    #ss-insights-panel *{box-sizing:border-box}
    .ss-ins-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
    .ss-ins-title{font-size:22px;font-weight:900;letter-spacing:-.6px;margin:0}
    .ss-ins-sub{font-size:12px;color:#666;margin:5px 0 0}
    .ss-ins-close{border:0;border-radius:12px;background:#e8e8e4;padding:9px 12px;font-weight:800;cursor:pointer}
    .ss-ins-filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
    .ss-ins-filter{border:0;border-radius:12px;background:#e8e8e4;padding:9px 12px;font-weight:800;cursor:pointer}
    .ss-ins-filter.active{background:#ffeb3b}
    .ss-ins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .ss-ins-card{background:#fff;border-radius:17px;padding:14px;min-width:0}
    .ss-ins-label{font-size:11px;color:#666;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
    .ss-ins-value{font-size:23px;font-weight:900;letter-spacing:-.5px;margin-top:6px;overflow-wrap:anywhere}
    .ss-ins-note{font-size:11px;color:#777;margin-top:4px;line-height:1.4}
    .ss-ins-section{font-size:14px;font-weight:900;margin:18px 0 8px}
    .ss-ins-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
    .ss-ins-row:last-child{border-bottom:0}
    .ss-ins-row strong{text-align:right;overflow-wrap:anywhere}
    .ss-ins-empty{padding:18px;background:#fff;border-radius:16px;font-size:13px;color:#666;line-height:1.5}
    .ss-ins-warning{font-size:11px;color:#666;line-height:1.5;margin-top:14px}
    @media(max-width:420px){#ss-insights-panel{padding:14px;border-radius:20px}.ss-ins-value{font-size:20px}.ss-ins-title{font-size:20px}}
  `;
  document.head.appendChild(style);

  var launch = document.createElement("button");
  launch.id = "ss-insights-launch";
  launch.type = "button";
  launch.textContent = "📊 Insights";
  launch.setAttribute("aria-haspopup", "dialog");
  document.body.appendChild(launch);

  var backdrop = document.createElement("div");
  backdrop.id = "ss-insights-backdrop";
  backdrop.innerHTML = '<section id="ss-insights-panel" role="dialog" aria-modal="true" aria-labelledby="ss-insights-title"><div class="ss-ins-head"><div><h2 id="ss-insights-title" class="ss-ins-title">Seller Insights</h2><p class="ss-ins-sub">A quick view of the sales and inventory saved on this device.</p></div><button type="button" class="ss-ins-close" id="ss-insights-close" aria-label="Close insights">Close ✕</button></div><div class="ss-ins-filters"><button type="button" class="ss-ins-filter active" data-range="30">Last 30 days</button><button type="button" class="ss-ins-filter" data-range="all">All recorded sales</button></div><div id="ss-insights-content"></div><p class="ss-ins-warning">These figures use SellSmart’s recorded inventory sales and saved product estimates. They are not a complete accounting report and may exclude orders or expenses entered elsewhere. Currency totals are kept separate rather than added together.</p></section>';
  document.body.appendChild(backdrop);

  var range = "30";
  var money = function (n, code) {
    var val = Number(n) || 0;
    try { return new Intl.NumberFormat(undefined, {style:"currency",currency:code || "USD",maximumFractionDigits:2}).format(val); }
    catch (_) { return (code || "$") + " " + val.toFixed(2); }
  };
  var read = function (key, fallback) {
    try { var v = JSON.parse(localStorage.getItem("ss_" + key) || "null"); return v == null ? fallback : v; }
    catch (_) { return fallback; }
  };
  var el = function (tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined) n.textContent = txt;
    return n;
  };
  var row = function (label, value) {
    var n = el("div", "ss-ins-row");
    n.appendChild(el("span", "", label));
    n.appendChild(el("strong", "", value));
    return n;
  };

  function render() {
    var allSales = read("sales", []);
    var inventory = read("inv", []);
    if (!Array.isArray(allSales)) allSales = [];
    if (!Array.isArray(inventory)) inventory = [];
    var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
    var sales = allSales.filter(function (x) {
      return x && Number.isFinite(Number(x.t)) && (range === "all" || Number(x.t) >= cutoff);
    });
    var codes = {};
    sales.forEach(function (x) {
      var c = x.code || "USD";
      if (!codes[c]) codes[c] = {sales:0, profit:0, count:0};
      codes[c].sales += Number(x.sale) || 0;
      codes[c].profit += Number(x.profit) || 0;
      codes[c].count += 1;
    });
    var low = inventory.filter(function (x) { return x && Number(x.stock) >= 0 && Number(x.stock) <= 3; });
    var totalStock = inventory.reduce(function (sum,x) { return sum + Math.max(0, Number(x && x.stock) || 0); },0);
    var content = document.getElementById("ss-insights-content");
    content.textContent = "";

    var grid = el("div","ss-ins-grid");
    var card = function (label, value, note) {
      var c = el("div","ss-ins-card");
      c.appendChild(el("div","ss-ins-label",label));
      c.appendChild(el("div","ss-ins-value",value));
      if (note) c.appendChild(el("div","ss-ins-note",note));
      grid.appendChild(c);
    };
    card("Recorded sales", String(sales.length), range === "30" ? "Last 30 days" : "All recorded sales");
    card("Products saved", String(inventory.length), "Products in your inventory list");
    card("Units in stock", String(totalStock), low.length + " product(s) at 3 units or fewer");
    card("Low-stock products", String(low.length), "Threshold: 3 units or fewer");
    content.appendChild(grid);

    if (!sales.length) {
      var empty = el("div","ss-ins-empty");
      empty.style.marginTop = "10px";
      empty.textContent = "No recorded inventory sales in this period yet. Use SellSmart’s inventory sale action to start building these insights.";
      content.appendChild(empty);
    } else {
      content.appendChild(el("h3","ss-ins-section","Sales totals by currency"));
      Object.keys(codes).sort().forEach(function (code) {
        var c = codes[code];
        var block = el("div","ss-ins-card");
        block.style.marginBottom = "8px";
        block.appendChild(row("Recorded sales value", money(c.sales, code)));
        block.appendChild(row("Estimated profit", money(c.profit, code)));
        block.appendChild(row("Transactions", String(c.count)));
        content.appendChild(block);
      });
      var byProduct = {};
      sales.forEach(function (x) {
        var key = String(x.name || "Unnamed product");
        if (!byProduct[key]) byProduct[key] = {profit:0, code:x.code || "USD", count:0};
        byProduct[key].profit += Number(x.profit) || 0;
        byProduct[key].count += 1;
      });
      var top = Object.keys(byProduct).map(function (name) { return {name:name, ...byProduct[name]}; })
        .sort(function (a,b) { return b.profit - a.profit; }).slice(0,5);
      content.appendChild(el("h3","ss-ins-section","Top products by recorded estimated profit"));
      var list = el("div","ss-ins-card");
      top.forEach(function (x) { list.appendChild(row(x.name + " · " + x.count + " sale(s)", money(x.profit,x.code))); });
      content.appendChild(list);
    }

    if (inventory.length) {
      content.appendChild(el("h3","ss-ins-section","Stock to check"));
      var stockList = el("div","ss-ins-card");
      var shown = inventory.filter(function (x) { return x && Number(x.stock) <= 3; }).slice(0,8);
      if (!shown.length) stockList.appendChild(el("div","ss-ins-note","No products are at or below 3 units."));
      shown.forEach(function (x) { stockList.appendChild(row(String(x.name || "Unnamed product") + " · " + String(x.platformName || "Platform not set"), String(Math.max(0,Number(x.stock)||0)) + " left")); });
      content.appendChild(stockList);
    }
  }

  function open() { render(); backdrop.style.display = "flex"; document.getElementById("ss-insights-close").focus(); }
  function close() { backdrop.style.display = "none"; launch.focus(); }
  launch.addEventListener("click", open);
  document.getElementById("ss-insights-close").addEventListener("click", close);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && backdrop.style.display === "flex") close(); });
  backdrop.querySelectorAll("[data-range]").forEach(function (b) {
    b.addEventListener("click", function () {
      range = b.getAttribute("data-range");
      backdrop.querySelectorAll("[data-range]").forEach(function (other) { other.classList.toggle("active", other === b); });
      render();
    });
  });
})();
</script>
